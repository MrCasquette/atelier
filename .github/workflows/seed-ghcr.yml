name: Seed GHCR (one-shot)

# Recopie les images déjà publiées sur Docker Hub vers GHCR privé.
#
# Raison d'être : le gate T3 de `docker-build.yml` tire l'image n-1 (`PREV_IMAGE`) pour valider
# le chemin de migration. Depuis la bascule sur GHCR, ce registre est vide — la prochaine release
# échouerait sur un `docker pull` d'image inexistante. On y sème la version réellement déployée.
#
# Effet de bord voulu : ce workflow VALIDE la chaîne `GITHUB_TOKEN` → `packages: write` → push GHCR
# avant qu'une vraie release en dépende.
#
# ⚠️ À SUPPRIMER une fois exécuté avec succès.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à recopier (sans le préfixe v), ex. 0.6.0'
        required: true
        default: '0.6.0'
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La source Docker Hub est publique → aucune authentification côté source. `imagetools create`
      # recopie le manifeste tel quel (multi-arch préservé, aucun rebuild, aucune couche recompressée).
      - name: Copier api + admin vers GHCR
        env:
          V: ${{ inputs.version }}
        run: |
          for target in api admin; do
            echo "→ echoppe-${target}:${V}"
            docker buildx imagetools create \
              --tag "ghcr.io/mrcasquette/echoppe-${target}:${V}" \
              --tag "ghcr.io/mrcasquette/echoppe-${target}:latest" \
              "axiomeapp/echoppe-${target}:${V}"
          done

      - name: Vérifier les manifestes poussés
        env:
          V: ${{ inputs.version }}
        run: |
          for target in api admin; do
            echo "=== ghcr.io/mrcasquette/echoppe-${target}:${V} ==="
            docker buildx imagetools inspect "ghcr.io/mrcasquette/echoppe-${target}:${V}"
          done
