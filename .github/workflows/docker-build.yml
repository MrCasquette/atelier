name: Build and Push Docker Images

# Deux entrées :
#   - workflow_call (voie normale) : appelé par release.yml APRÈS un publish npm réussi, avec la
#     version publiée → release « one-move » (merge de la PR Version = npm + images).
#   - push tag v* (échappatoire manuelle) : re-cut d'images sans repasser par une release npm.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version des images (sans le préfixe v), ex. 0.5.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mrcasquette/echoppe

jobs:
  # Gate de publication : construit l'image `api` (le Dockerfile réellement publié) et la
  # valide en base vierge ET en upgrade AVANT tout push (T2–T5 du runbook). Si un seul échoue,
  # `build-and-push` ne tourne pas → aucune image cassée ne part sur le registre.
  integration:
    runs-on: ubuntu-latest
    # `packages: read` : le gate T3 tire l'image n-1 PUBLIÉE (PREV_IMAGE) pour valider le chemin
    # d'upgrade. Depuis la bascule sur GHCR privé, ce `docker pull` exige une authentification.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Requis pour le `docker pull` de PREV_IMAGE (image n-1 privée sur GHCR) du gate T3.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construit `echoppe-api:integration` (via l'orchestrateur) + T2 (fresh) / T3 (upgrade
      # depuis :latest publié) / T4 (parité contrat) / T5 (idempotence). Docker dispo sur le runner.
      - name: Integration gate (image T2–T5)
        run: bun run --cwd apps/echoppe-api test:integration

  build-and-push:
    needs: integration
    runs-on: ubuntu-latest
    # `packages: write` : pousse sur GHCR avec le GITHUB_TOKEN (aucun PAT). Déclaré explicitement
    # plutôt que de dépendre du défaut permissif du dépôt — et SURTOUT parce qu'un workflow appelé
    # via `workflow_call` ne peut jamais dépasser les permissions de son appelant (cf. release.yml).
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # UNE image : le binaire natif de l'API, qui sert aussi le dashboard sous /-/admin
          # (ADR-0052). Multi-arch réel — le `dist` du dashboard est construit une seule fois
          # sur la plateforme de build (`--platform=$BUILDPLATFORM`), donc plus d'amd64 seul
          # ni d'émulation QEMU pour un résultat pourtant arch-indépendant.
          - target: api
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-build arm64)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version = input (appel release.yml) sinon dérivée du tag v* (push manuel).
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
