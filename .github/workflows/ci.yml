name: CI

# Garde qualité sur main + PR. Le drift-guard (T1) échoue si le schéma Drizzle
# diverge des migrations committées — c'est ce qui aurait attrapé l'incident 0.4.0
# (colonnes poussées en dev via db:push, jamais générées en migration).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Les libs publiables exposent leurs types depuis dist/ (pas les sources). Les apps qui
      # les consomment (ex. apps/echoppe-store → @echoppe/client) ne type-checkent qu'avec ce dist buildé.
      - name: Build packages (deps du type-check)
        run: |
          bun run --cwd packages/content build
          bun run --cwd packages/echoppe-client build

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      # Tests unitaires des paquets et de l'administration — 13 espaces de travail. Sans base : ce
      # sont des tests de logique pure — les tests de frontière, eux, tournent dans le job `smoke`
      # contre un vrai Postgres. DATABASE_URL placeholder, car importer @echoppe/core construit son
      # client au chargement du module et lève sans la variable.
      - name: Unit tests
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
        run: bun run test

      # T1 — Garde anti-dérive : le schéma TS doit être entièrement capturé par les
      # migrations committées. `db:generate` est hors-ligne (compare schéma ↔ snapshots),
      # DATABASE_URL est un placeholder requis par drizzle.config mais aucune connexion
      # n'est ouverte. S'il produit un fichier, c'est qu'une migration manque → échec.
      #
      # Le guard DÉCOUVRE les `drizzle.config.ts` du dépôt : un second produit doté d'un schéma
      # est gardé sans qu'on touche à ce workflow.
      - name: Migration drift guard
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
        run: bun run drift-guard

      # Garde d'isolation : deux produits frères partagent `@repo/*`, jamais leurs propres briques.
      # Vérifie les dépendances DÉCLARÉES et les imports RÉELS (une dep non déclarée résout quand
      # même par hoisting). Silencieuse tant qu'il n'y a qu'un seul produit.
      - name: Product isolation
        run: bun run product-isolation

      # Espace réservé `/-/` et origine du dashboard (ADR-0052) — deux règles qui se perdent en
      # silence : une surface d'exploitation remontée à la racine, ou un VITE_API_URL qui repousse
      # et refige l'adresse de l'API dans le bundle publié.
      - name: Reserved space
        run: bun run reserved-space

      # Garde anti-dérive du CONTRAT SDK : régénère le client depuis l'app pure (offline) et échoue
      # si les types figés (openapi.ts/models.ts/facade.ts) divergent des routes. Miroir du drift-guard
      # Drizzle : attrape « route changée, SDK figé oublié » dès la PR (au lieu du seul gate release
      # T4). DATABASE_URL placeholder — l'app pure ne fait aucune requête, sert juste /-/docs/json.
      - name: Contract drift guard
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
        run: bun run contracts:check

  # T2 — Tests de frontière sur base vierge depuis les migrations : Postgres neuf → migrate → la
  # suite `tests/` complète (contrat HTTP, matrice RBAC, SQL). Le smoke storefront en fait partie —
  # il aurait attrapé le 500 de l'image 0.4.0 (colonnes manquantes) et le /countries/ vide.
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: echoppe
          POSTGRES_PASSWORD: echoppe
          POSTGRES_DB: echoppe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echoppe -d echoppe"
          --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # SMOKE_DATABASE_URL cible le service Postgres neuf (base vierge). Le wrapper l'utilise
      # tel quel (pas de conteneur éphémère à provisionner en CI) et pose SMOKE_RUN=1, sans
      # quoi les tests refusent de tourner — garde-fou contre un run sur une base non jetable.
      - name: Smoke tests
        env:
          SMOKE_DATABASE_URL: postgresql://echoppe:echoppe@localhost:5432/echoppe
        run: bun run --cwd apps/echoppe-api test:smoke
